name: Shift Malam
on:
  schedule:
    - cron: "0 12 * * *"   # 19.00 WIB
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shift-malam
  cancel-in-progress: false
jobs:
  shift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pasang ffmpeg, font, dan suara gratis
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install edge-tts pillow
      - name: Jalankan agen
        run: python run_agents.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Simpan hasil
        if: always()
        run: |
          git config user.name "kantor-ai"
          git config user.email "kantor-ai@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Shift malam $(date -u +%F)"
          git pull --rebase -X theirs origin main || git rebase --abort
          git push || (sleep 5 && git pull --rebase -X theirs origin main && git push)
