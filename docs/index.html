<meta charset="utf-8">
<title>Agent HQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500&display=swap">
<style>
/* Layout: satu kolom ala poster vertikal. Header, kantor isometrik 3x2 ruang, roster agen, kartu detail, log shift.
   Satu tampilan gelap (shift malam), sengaja tanpa mode terang. */
:root{
  --bg:#0a0f1f; --panel:#111a33; --line:#222d52; --fg:#e9edf9; --mute:#8f9bc0;
  --accent:#b08cff;
  --ok:#4ade80; --warn:#fbbf24; --info:#38bdf8; --err:#f87171;
  --display:"Bricolage Grotesque","Inter",system-ui,sans-serif;
  --body:"Inter",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{border:1px solid var(--warn);color:var(--warn);padding:1px 7px;border-radius:99px}
h1{font:800 32px/1.05 var(--display);margin:0;text-wrap:balance}
.sub{color:var(--mute);margin:0}
.stage{background:radial-gradient(120% 90% at 50% 0%,#16224a 0%,var(--bg) 70%);border:1px solid var(--line);border-radius:14px;overflow:hidden}
canvas{display:block;width:100%;touch-action:manipulation}
.roster{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);color:var(--fg);
  font:500 13px var(--body);padding:7px 11px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:#1a2147}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none}
.s-kerja{--c:var(--ok)}.s-menunggu{--c:var(--warn)}.s-selesai{--c:var(--info)}.s-error{--c:var(--err)}
.dot.s-kerja,.dot.s-menunggu,.dot.s-selesai,.dot.s-error{background:var(--c)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font:800 20px var(--display);margin:0}
.role{color:var(--mute);font-size:13px}
.pill{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--c);border:1px solid var(--c);padding:2px 8px;border-radius:99px;align-self:flex-start}
.task{font-size:13px;color:var(--mute)}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font:13px/1.55 var(--mono);background:#0b1226;border-radius:8px;padding:12px;max-height:260px;overflow:auto}
h3{font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
li{display:grid;grid-template-columns:48px 70px 1fr;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:13px;min-width:0}
li:first-child{border-top:0}
li time{font-family:var(--mono);color:var(--mute)}
li b{font-weight:600}
li span{overflow-wrap:anywhere;color:#c9d1ee}
.note{font-size:12px;color:var(--mute)}
</style>

<main>
  <header>
    <div class="eyebrow"><span>Agent HQ · Kantor AI</span><span id="demo" class="badge" hidden>Data contoh</span></div>
    <h1>Shift malam, karyawannya bukan manusia</h1>
    <p class="sub" id="meta">Memuat status…</p>
  </header>

  <section class="stage"><canvas id="cv" aria-label="Denah kantor AI dengan enam ruang"></canvas></section>

  <section class="roster" id="roster" aria-label="Daftar agen"></section>

  <section class="card" id="detail" aria-live="polite"></section>

  <section class="card">
    <h3>Log shift</h3>
    <ol id="log"></ol>
  </section>
  <p class="note" id="foot"></p>
</main>

<script>
const ROOMS=[
 {id:'konten',name:'KONTEN · MALAM',c:'#8b7bd8',i:0,j:0},
 {id:'brainstorm',name:'BRAINSTORM',c:'#d4b84a',i:1,j:0},
 {id:'kreatif',name:'KREATIF',c:'#d479b0',i:2,j:0},
 {id:'brain',name:'THE BRAIN',c:'#3fb6cf',i:0,j:1},
 {id:'sosmed',name:'SOSMED',c:'#e0707f',i:1,j:1},
 {id:'mess',name:'MESS',c:'#6fbf73',i:2,j:1}
];
const SKIN=['#e8b894','#c98f68','#f0c8a4','#a8734f'];
const STATE_COLOR={kerja:'#4ade80',menunggu:'#fbbf24',selesai:'#38bdf8',error:'#f87171'};
const FALLBACK={demo:true,shift:'19.00-07.00 WIB',updated:null,log:[],agents:[
 {id:'gilang',name:'Gilang',role:'Content Analyst',room:'konten',state:'menunggu',last_task:'Belum ada status.json',output:''},
 {id:'dion',name:'Dion',role:'Brainstormer',room:'brainstorm',state:'menunggu',last_task:'',output:''},
 {id:'mila',name:'Mila',role:'Brainstormer',room:'brainstorm',state:'menunggu',last_task:'',output:''},
 {id:'ale',name:'Ale',role:'Penulis Naskah',room:'kreatif',state:'menunggu',last_task:'',output:''},
 {id:'zaki',name:'Zaki',role:'Manajer (The Brain)',room:'brain',state:'menunggu',last_task:'',output:''},
 {id:'bima',name:'Bima',role:'Media Sosial',room:'sosmed',state:'menunggu',last_task:'',output:''}]};

let data=FALLBACK, selected=null, hits=[], W=0, H=0, hw=20, ox=0, oy=0;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

function shade(hex,f){const n=parseInt(hex.slice(1),16);
  const r=Math.min(255,(n>>16&255)*f),g=Math.min(255,(n>>8&255)*f),b=Math.min(255,(n&255)*f);
  return `rgb(${r|0},${g|0},${b|0})`}

const GAP=1, RS=3;
function P(x,y,z=0){return [ox+(x-y)*hw, oy+(x+y)*hw*.55-z*hw*.95]}
function poly(pts,fill){ctx.beginPath();pts.forEach((p,k)=>k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill()}
function box(x,y,w,d,h,z0,col){
  const t=z0+h;
  poly([P(x,y+d,z0),P(x+w,y+d,z0),P(x+w,y+d,t),P(x,y+d,t)],col.l);
  poly([P(x+w,y,z0),P(x+w,y+d,z0),P(x+w,y+d,t),P(x+w,y,t)],col.r);
  poly([P(x,y,t),P(x+w,y,t),P(x+w,y+d,t),P(x,y+d,t)],col.t);
}
const cols=(c,k=1)=>({t:shade(c,1.05*k),l:shade(c,.72*k),r:shade(c,.55*k)});

function layout(){
  const w=cv.parentElement.clientWidth;
  const ext=3*RS+2*GAP+2*RS+GAP;
  hw=Math.max(18,(w-24)/ext);
  W=Math.max(w,ext*hw+24);
  H=(ext*hw*.55)+hw*3.2+46;
  const dpr=Math.min(devicePixelRatio||1,3);
  cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ox=(2*RS+GAP)*hw+ (W-ext*hw)/2; oy=hw*1.9+14;
}

function slots(n){return n===1?[[1.5,1.15]]:[[.8,1.6],[2.2,.8]]}

function drawAgent(a,x,y,t){
  const skin=SKIN[(a.name.charCodeAt(0)+a.name.length)%SKIN.length];
  const body=shade(ROOMS.find(r=>r.id===a.room).c,.9);
  // meja
  box(x-.55,y+.12,1.1,.62,.42,.18,cols('#e9edf5'));
  box(x-.22,y+.2,.44,.06,.32,.6,cols('#1c2340'));  // monitor
  // karyawan duduk di belakang meja
  const bob=(a.state==='kerja'&&!reduce)?Math.sin(t/260+x*3)*.03:0;
  box(x-.17,y-.2,.34,.3,.5,.18+bob,cols(body));
  box(x-.14,y-.17,.28,.26,.28,.68+bob,cols(skin));
  const top=P(x,y-.05,.98+bob);
  // cincin status di lantai
  const c=STATE_COLOR[a.state]||'#8f9bc0', f=P(x,y+.2,.18);
  ctx.save();ctx.strokeStyle=c;ctx.globalAlpha=a.state==='kerja'&&!reduce?.35+.3*Math.sin(t/300):.4;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.ellipse(f[0],f[1]+hw*.35,hw*.75,hw*.4,0,0,7);ctx.stroke();ctx.restore();
  hits.push({id:a.id,x:top[0],y:top[1]+hw*.3});
  return {top,c};
}

function labels(list){
  ctx.font='600 10px "JetBrains Mono",monospace';ctx.textAlign='center';ctx.textBaseline='middle';
  list.forEach(({a,top,c})=>{
    const tw=ctx.measureText(a.name).width+18, x=top[0], y=top[1]-hw*.55;
    ctx.fillStyle=a.id===selected?'#2a2f66':'rgba(10,15,31,.85)';
    ctx.strokeStyle=a.id===selected?'#b08cff':'rgba(255,255,255,.18)';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(x-tw/2,y-9,tw,18,9);ctx.fill();ctx.stroke();
    ctx.fillStyle=c;ctx.beginPath();ctx.arc(x-tw/2+9,y,3,0,7);ctx.fill();
    ctx.fillStyle='#e9edf9';ctx.fillText(a.name,x+4,y+.5);
  });
}

function draw(t=0){
  ctx.clearRect(0,0,W,H);hits=[];const tags=[];
  const order=[...ROOMS].sort((a,b)=>(a.i+a.j)-(b.i+b.j)||a.j-b.j);
  order.forEach(r=>{
    const rx=r.i*(RS+GAP), ry=r.j*(RS+GAP);
    box(rx,ry,RS,RS,.18,0,cols(r.c));
    box(rx,ry,RS,.1,.7,.18,cols(r.c,1.05));
    box(rx,ry,.1,RS,.7,.18,cols(r.c,.95));
    // tanaman
    box(rx+2.45,ry+2.4,.28,.28,.2,.18,cols('#8a6a4a'));
    box(rx+2.4,ry+2.35,.38,.38,.34,.38,cols('#4fcf8a'));
    if(r.id==='brain'){
      const o=P(rx+1.5,ry+2.3,.55),k=hw*(.55+(reduce?0:.1*Math.sin(t/400)));
      const g=ctx.createRadialGradient(o[0],o[1],1,o[0],o[1],k*2.2);
      g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.25,'rgba(120,230,255,.6)');g.addColorStop(1,'rgba(63,182,207,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(o[0],o[1],k*2.2,0,7);ctx.fill();
    }
    if(r.id==='mess'){box(rx+.5,ry+1.9,1.7,.6,.35,.18,cols('#b86a4a'));box(rx+.5,ry+1.7,1.7,.22,.55,.18,cols('#b86a4a',.9))}
    const mine=data.agents.filter(a=>a.room===r.id), sl=slots(mine.length);
    mine.forEach((a,k)=>{const [sx,sy]=sl[k]||[1.5,1.15];const res=drawAgent(a,rx+sx,ry+sy,t);tags.push({a,...res})});
  });
  // nama ruang di tepi depan
  ctx.font='600 9px "JetBrains Mono",monospace';ctx.textAlign='center';ctx.textBaseline='middle';
  ROOMS.forEach(r=>{const p=P(r.i*(RS+GAP)+1.5,r.j*(RS+GAP)+2.6,.18);ctx.fillStyle='rgba(10,15,31,.55)';ctx.fillText(r.name,p[0],p[1])});
  labels(tags);
}

function loop(t){draw(t);requestAnimationFrame(loop)}

function pick(e){
  const b=cv.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;
  let best=null,d=1e9;hits.forEach(h=>{const q=Math.hypot(h.x-x,h.y-y);if(q<d){d=q;best=h}});
  if(best&&d<hw*1.6)select(best.id);
}
cv.addEventListener('click',pick);

function select(id){selected=id;renderRoster();renderDetail();if(reduce)draw(0)}

function renderRoster(){
  $('roster').innerHTML=data.agents.map(a=>
    `<button class="chip" data-id="${a.id}" aria-pressed="${a.id===selected}"><span class="dot s-${a.state}"></span>${esc(a.name)}<span class="role">${esc(a.role)}</span></button>`).join('');
  $('roster').querySelectorAll('button').forEach(b=>b.onclick=()=>select(b.dataset.id));
}
function renderDetail(){
  const a=data.agents.find(x=>x.id===selected);
  $('detail').innerHTML=a?
   `<h2>${esc(a.name)}</h2><span class="role">${esc(a.role)} · shift ${esc(data.shift||'')}</span>
    <span class="pill s-${a.state}">${esc(a.state)}</span>
    <div class="task">${esc(a.last_task)}</div>
    ${a.output?`<pre>${esc(a.output)}</pre>`:''}`:
   `<h2>Pilih karyawan</h2><span class="role">Ketuk karyawan di denah atau namanya di daftar untuk melihat hasil kerjanya semalam.</span>`;
}
function renderLog(){
  const nm=Object.fromEntries(data.agents.map(a=>[a.id,a.name]));
  $('log').innerHTML=data.log.length?data.log.map(l=>`<li><time>${esc(l.t)}</time><b>${esc(nm[l.agent]||l.agent)}</b><span>${esc(l.text)}</span></li>`).join('')
    :'<li><span>Belum ada aktivitas. Jalankan shift pertama dari GitHub Actions.</span></li>';
}
function renderMeta(){
  $('demo').hidden=!data.demo;
  const up=data.updated?new Date(data.updated).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}):'belum pernah';
  $('meta').textContent=`${data.agents.length} agen · shift ${data.shift||'-'} · update terakhir ${up}`;
  $('foot').textContent=data.demo?'Tampilan ini memakai data contoh, bukan hasil model AI.':'Dibuat otomatis oleh agen. Periksa sebelum dipakai.';
}

async function init(){
  try{const r=await fetch('status.json',{cache:'no-store'});if(r.ok)data=await r.json()}catch(e){}
  layout();renderMeta();renderRoster();renderDetail();renderLog();
  reduce?draw(0):requestAnimationFrame(loop);
}
addEventListener('resize',()=>{layout();if(reduce)draw(0)});
init();
</script>
